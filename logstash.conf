input {
  file {
  path => "/path/to/logs/*.log"
  start-position => "beginning"
  }
  syslog {
  port =>514
  }
  }
filter {
  gork{
  match => {
  "message" => "%{SYSLOGTIMESTAMP:timestamp} %{WORD:logsource} %{GREEDYDATA:message}"
  }
  }
  date {
  match => ["timestamp", "MMM  D  HH:mm:ss", "MMM  dd  HH:mm:ss"]
  }
  }

output {
  elasticsearch {
  hosts => ["http://localhost:9200"]
  index =>"logs-%{+YYYY.MM.dd}"
    }
  stdout { cpdec => rubydebug }
    }
